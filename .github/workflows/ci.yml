name: CI Pipeline

on:
  push:
    branches: [ main, dev, feat/*, research/* ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install Dependencies
        run: poetry install --no-interaction

      - name: Run Pytest (legacy CI suite)
        run: |
          PYTHONPATH=. poetry run pytest multifactor_portfolio/training/test_train.py

      - name: Run Pytest (canonical v4 suite)
        run: |
          poetry run pytest tests/ -q
